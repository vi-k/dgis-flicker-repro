name: dgis_flicker_repro
description: >-
  Минимальное воспроизведение: маркер 2GIS Mobile SDK пропадает на несколько
  кадров при записи iconMapDirection.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Версия, на которой снят симптом. Для проверки на актуальной — 14.0.0;
  # там MapWidgetController требует sdk.Context параметром, см. README.
  dgis_mobile_sdk_full: 13.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
